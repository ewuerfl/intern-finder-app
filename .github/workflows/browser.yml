name: Browser-only career sites
on:
  schedule:
    - cron: '41 */4 * * *'   # every 4 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Read IBM and other browser-only sites
        working-directory: intern-finder/pipeline
        run: timeout 1200 python3 browser_jobs.py
      - name: Save
        run: |
          git config user.name "intern-finder-bot"
          git config user.email "intern-finder-bot@users.noreply.github.com"
          git add intern-finder/pipeline/browser_jobs.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Browser sweep $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do
            if timeout 60 git pull -q --rebase -X theirs origin main && timeout 90 git push -q origin HEAD:main; then echo "Pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          exit 1
