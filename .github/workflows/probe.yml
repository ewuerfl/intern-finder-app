name: Daily career-site probe
on:
  schedule:
    - cron: '13 6 * * *'    # once a day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find company career sites (Jibe, Phenom, Eightfold, Workday)
        working-directory: intern-finder/pipeline
        run: |
          python3 boards.py
          timeout 4800 python3 probe.py
      - name: Save the list
        timeout-minutes: 6
        run: |
          git config user.name "intern-finder-bot"
          git config user.email "intern-finder-bot@users.noreply.github.com"
          git add intern-finder/pipeline/probed.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Career-site probe $(date -u +%F)"
          git checkout -q -- . 2>/dev/null || true
          for i in 1 2 3; do
            if timeout 60 git pull -q --rebase -X theirs origin main && timeout 90 git push -q origin HEAD:main; then echo "Pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          echo "::error title=Save failed::could not push probed.json"; exit 1
